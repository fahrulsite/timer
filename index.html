<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timer Lomba - Godean Bertakbir #11</title>
    <link rel="stylesheet" href="style.css">

</head>
<body>

    <!-- Bagian Atas: Logo & Judul -->
    <div class="header-zone">
        <!-- Silakan letakkan file gambar logo Anda di folder yang sama dengan nama logo.png -->
        <img src="logo.png" alt="Logo Lomba" class="logo" onerror="this.style.display='none'; document.getElementById('logo-placeholder').style.display='block';">
    </div>

    <!-- Bagian Tengah: Timer dan Kontrol -->
    <div class="main-zone">
        <div id="timer" class="timer-display">00:00</div>
        
        <div class="control-buttons">
            <button id="startPauseBtn" class="btn btn-start">Start</button>
            <button id="resetBtn" class="btn btn-reset">Reset</button>
        </div>
    </div>

    <!-- Spacer bawah penyeimbang layout proyektor -->
    <div class="footer-spacer"></div>

    <script>
        let timerInterval = null;
        let totalSeconds = 0;
        let isRunning = false;

        const timerDisplay = document.getElementById('timer');
        const startPauseBtn = document.getElementById('startPauseBtn');
        const resetBtn = document.getElementById('resetBtn');

        // Batas waktu: 6 Menit (6 * 60 = 360 Detik)
        const TIME_LIMIT = 10; 

        function updateDisplay() {
            let minutes = Math.floor(totalSeconds / 60);
            let seconds = totalSeconds % 60;

            // Memastikan format waktu selalu 2 digit (contoh: 05:09)
            let formattedMinutes = String(minutes).padStart(2, '0');
            let formattedSeconds = String(seconds).padStart(2, '0');

            timerDisplay.textContent = `${formattedMinutes}:${formattedSeconds}`;

            // Jika waktu telah mencapai atau melebihi 6 menit, teks berubah menjadi merah
            if (totalSeconds >= TIME_LIMIT) {
                timerDisplay.classList.add('overtime');
            } else {
                timerDisplay.classList.remove('overtime');
            }
        }

        function startTimer() {
            if (!isRunning) {
                isRunning = true;
                startPauseBtn.textContent = 'Pause';
                startPauseBtn.className = 'btn btn-pause';
                
                timerInterval = setInterval(() => {
                    totalSeconds++;
                    updateDisplay();
                }, 1000);
            }
        }

        function pauseTimer() {
            if (isRunning) {
                isRunning = false;
                startPauseBtn.textContent = 'Start';
                startPauseBtn.className = 'btn btn-start';
                clearInterval(timerInterval);
            }
        }

        startPauseBtn.addEventListener('click', () => {
            if (isRunning) {
                pauseTimer();
            } else {
                startTimer();
            }
        });

        resetBtn.addEventListener('click', () => {
            pauseTimer();
            totalSeconds = 0;
            updateDisplay();
        });

        // Tampilkan keadaan awal waktu 00:00 saat halaman pertama dimuat
        updateDisplay();
    </script>
</body>
</html>
